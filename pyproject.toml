[project]
name = "blackbox"
version = "0.1.0"
description = "Hardcore black box for Path of Exile 2: records deaths with context from Client.txt"
readme = "README.md"
authors = [
    { name = "MaxTor2001", email = "maxtor2008@mail.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "pyperclip>=1.11.0",
    "uvicorn>=0.52.4",
    "websockets>=17.1",
]

[project.scripts]
blackbox = "blackbox.cli:cli"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]
